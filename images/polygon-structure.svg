<svg width="250" height="250" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background panel -->
  <rect width="150" height="150" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Exterior Ring [0] (Outer Boundary) - Square -->
  <rect x="15" y="15" width="120" height="120" rx="2" fill="#228be6" fill-opacity="0.08" stroke="#1c7ed6" stroke-width="2"/>
  <text x="75" y="27" font-family="sans-serif" font-size="7" font-weight="bold" fill="#1c7ed6" text-anchor="middle">ring[0] (outer boundary)</text>

  <!-- Interior Ring [1] (Hole A) - Right-angled Triangle - Top Right (Mirrored, 2x Tall) -->
  <polygon points="85,35 125,35 125,85" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="112" y="50" font-family="sans-serif" font-size="5" font-weight="bold" fill="#1c7ed6" text-anchor="middle">ring[1]</text>
  <text x="112" y="56" font-family="sans-serif" font-size="5" font-weight="bold" fill="#1c7ed6" text-anchor="middle">(hole A)</text>

  <!-- Interior Ring [2] (Hole B) - Tall, narrow rectangle - Bottom Left -->
  <rect x="25" y="80" width="30" height="45" rx="2" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="40" y="101" font-family="sans-serif" font-size="5" font-weight="bold" fill="#1c7ed6" text-anchor="middle">ring[2]</text>
  <text x="40" y="107" font-family="sans-serif" font-size="5" font-weight="bold" fill="#1c7ed6" text-anchor="middle">(hole B)</text>

  <!-- Pole of Inaccessibility (optimal placement) and its Maximum Distance Incircle -->
  <circle cx="90.71" cy="99.29" r="35.71" fill="none" stroke="#e03131" stroke-width="1.25" stroke-dasharray="3 3"/>
  <circle cx="90.71" cy="99.29" r="3.5" fill="#e03131"/>
  <text x="90.71" y="113.5" font-family="sans-serif" font-size="5" font-weight="bold" fill="#e03131" text-anchor="middle">pole of</text>
  <text x="90.71" y="119.5" font-family="sans-serif" font-size="5" font-weight="bold" fill="#e03131" text-anchor="middle">inaccessibility</text>
</svg>
